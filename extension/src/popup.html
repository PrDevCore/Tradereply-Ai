<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; margin: 0; padding: 16px; font-family: sans-serif; background: #090d16; color: #e2e8f0; }
    h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 6px; color: #38bdf8; }
    label { font-size: 12px; font-weight: bold; color: #94a3b8; display: block; margin-top: 8px; }
    textarea, select, input { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; }
    button { width: 100%; margin-top: 12px; background: #0284c7; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0369a1; }
    button.secondary { background: #1e293b; border: 1px solid #334155; }
    .status { margin-top: 8px; font-size: 11px; color: #10b981; text-align: center; }
    .row { display: flex; gap: 6px; }
    .row button { margin-top: 8px; }
    #conn-list { margin-top: 8px; font-size: 11px; color: #cbd5e1; }
    #conn-list div { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; margin-top: 6px; word-break: break-all; }
    .hint { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>
  <h2><span>⚡</span> PR Reply AI</h2>

  <div id="auth-section">
    <label>Account email</label>
    <input id="email" type="email" placeholder="you@business.co.uk" />
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" />
    <div class="row">
      <button id="signin-btn">Sign in</button>
      <button id="signup-btn" class="secondary">Create account</button>
    </div>
    <p class="hint">First create your account on the TradeReply web app, then sign in here. After sign-in the extension activates on every platform URL you connected.</p>
  </div>

  <div id="main-section" style="display:none;">
    <label>Active Tone</label>
    <select id="tone">
      <option value="professional_polished">Professional & Polished</option>
      <option value="friendly_approachable">Friendly & Approachable</option>
      <option value="urgent_fasttrack">Emergency / Fast Dispatch</option>
      <option value="direct_pricing">Direct Pricing & Terms</option>
    </select>

    <label>Customer Message</label>
    <textarea id="msg" rows="4" placeholder="Paste a message, or let the extension auto-detect it on your connected site..."></textarea>

    <button id="draft-btn">Generate Personalized Reply</button>
    <div id="status" class="status">Signed in — ready.</div>

    <label>Connect another platform URL</label>
    <div class="row">
      <input id="new-url" placeholder="https://www.facebook.com/yourpage" style="flex:1;" />
      <button id="add-url-btn" style="width:auto;padding:8px 12px;">Add</button>
    </div>
    <div id="conn-list"></div>
    <button id="signout-btn" class="secondary">Sign out</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
